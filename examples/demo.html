<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Components Library Demo</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 24px; }
      .my-button { border: 0; padding: 8px 12px; border-radius: 4px; color: #fff; }
      .my-button--primary { background: #2563eb; }
      .my-button--secondary { background: #4b5563; }
      .my-card { border: 1px solid #d1d5db; padding: 16px; border-radius: 8px; margin: 16px 0; }
      .my-card__title { margin: 0 0 8px; }
      .my-card__footer { margin-top: 12px; color: #6b7280; font-size: 0.9rem; }
      .my-input { margin: 12px 0; display: grid; gap: 6px; }
      .my-input input { padding: 8px; border: 1px solid #d1d5db; border-radius: 4px; }
      .my-table { width: 100%; border-collapse: collapse; margin-top: 12px; }
      .my-table th, .my-table td { border: 1px solid #d1d5db; padding: 8px; text-align: left; }
      .demo-grid { max-width: 720px; }
    </style>
  </head>
  <body>
    <div class="demo-grid" id="app"></div>
    <script type="module">
      import { MyButton, MyCard, MyInput, MyTable, formatDate, formatTitleCase } from '../index.js';

      const table = MyTable({
        columns: [
          { key: 'name', label: 'Name' },
          { key: 'role', label: 'Role' },
          { key: 'joinedAt', label: 'Joined' },
        ],
        rows: [
          { name: 'emanuel haupper', role: 'maintainer', joinedAt: formatDate('2025-04-02') },
          { name: 'jane doe', role: 'contributor', joinedAt: formatDate('2025-04-18') },
        ].map((item) => ({ ...item, name: formatTitleCase(item.name), role: formatTitleCase(item.role) })),
      });

      document.getElementById('app').innerHTML = `
        ${MyButton({ label: 'Primary Action', variant: 'primary' })}
        ${MyButton({ label: 'Secondary Action', variant: 'secondary' })}
        ${MyInput({ name: 'project', label: 'Project name', placeholder: 'components-library' })}
        ${MyCard({ title: 'MyCard component', content: 'Reusable card layout for content blocks.', footer: 'Footer text' })}
        ${table}
      `;
    </script>
  </body>
</html>
